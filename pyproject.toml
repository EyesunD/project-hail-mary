[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hailmary"
version = "0.1.0"
description = "Quantitative trading backtesting and analytics platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2",
    "requests>=2.31",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "pyarrow>=15.0",      # fast parquet I/O for caching
    # Quant / stats
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "empyrical>=0.5",
    # Visualisation
    "plotly>=5.22",
    "kaleido>=0.2",       # static image export for plotly
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Config & utilities
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "loguru>=0.7",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
]
alpaca = [
    "alpaca-py>=0.21",
]
polygon = [
    "polygon-api-client>=1.14",
]
dash = [
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
]

[project.scripts]
hailmary = "hailmary.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hailmary"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=hailmary --cov-report=term-missing -q"

[tool.coverage.run]
source = ["src/hailmary"]
